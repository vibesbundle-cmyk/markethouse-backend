# Render Blueprint — one click creates Postgres + Redis + the Go API.
# Create a free GitHub repo, push this project, then on render.com:
#   New -> Blueprint -> pick the repo -> Apply.

databases:
  - name: markethouse-db
    databaseName: markethouse
    user: markethouse
    plan: free

redis:
  - name: markethouse-redis
    plan: free

services:
  - type: web
    name: markethouse-api
    runtime: go
    plan: free
    region: oregon
    buildCommand: go build -o markethouse-api ./cmd/server
    startCommand: ./markethouse-api
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: markethouse-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: markethouse-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        value: https://markethouse-api.onrender.com
      # Flutter web origin(s) allowed to call the API (comma-separated).
      # Replace with your real static-site URL once the frontend is deployed.
      - key: CORS_ORIGINS
        value: https://markethouse-web.onrender.com,https://markethouse.github.io
      # Set these in the Render dashboard (Environment) after deploy:
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER
        sync: false
      - key: PAYMENT_PROVIDER
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
